x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    # Host port 8082 - 8081 is already used by usb_monitor on this same
    # server (see Caddyfile). Not published to a specific interface: this
    # host isn't reachable from the open internet, and Caddy is the only
    # thing meant to reach this port (see the Caddyfile snippet in README.md).
    ports:
      - "8082:8080"
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
